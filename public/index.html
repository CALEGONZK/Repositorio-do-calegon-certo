<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonatos</title>
<style>
  :root { --bg:#100b1c; --card:#1a1230; --line:#3a2d63; --txt:#fff; --mut:#b9a9e6; --pri:#7c5cff; --red:#ff4d6d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:40px 20px 80px; }
  h1,h2 { margin:0 0 6px; } h2 { margin-top:36px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; cursor:pointer; }
  .card:hover { border-color:var(--pri); }
  .tags span { background:#2c1f54; border-radius:99px; padding:3px 10px; font-size:12px; margin-right:6px; }
  .card h3 { margin:12px 0 6px; text-transform:uppercase; }
  .card p { font-size:12px; color:var(--mut); line-height:1.5; margin:0 0 10px; }
  .price { font-weight:700; } .price small { color:var(--mut); font-weight:400; margin-left:8px; }
  .actions { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .link { font-size:13px; font-weight:600; }
  .btn-excluir { background:transparent; color:var(--red); border:1px solid var(--red); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .btn-excluir:hover { background:var(--red); color:#fff; }
  label { display:block; font-size:12px; color:var(--mut); margin:14px 0 4px; }
  select { width:100%; background:#0c0816; border:1px solid var(--line); color:#fff; border-radius:6px; padding:10px; font-size:14px; }
  input { width:100%; background:#0c0816; border:1px solid var(--line); color:#fff; border-radius:6px; padding:10px; font-size:14px; }
  button.primary { background:var(--pri); color:#fff; border:0; border-radius:6px; padding:11px 18px; font-size:14px; cursor:pointer; margin-top:16px; }
  .modal { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal.open { display:flex; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; width:100%; max-width:440px; max-height:90vh; overflow:auto; }
  .opcao { display:block; width:100%; text-align:left; background:#0c0816; color:#fff; border:1px solid var(--line); border-radius:6px; padding:10px; margin-top:8px; cursor:pointer; }
  .opcao:hover { border-color:var(--pri); }
  .msg { margin-top:12px; font-size:13px; } .erro { color:var(--red); } .ok { color:#5be49b; }
  ul.jog { padding-left:18px; font-size:13px; color:var(--mut); } 
  .x { float:right; background:none; border:0; color:var(--mut); font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Campeonatos</h1>
  <div class="sub">Clique em um campeonato para inscrever seu time.</div>
  <div class="grid" id="lista"></div>

  <h2>Novo campeonato</h2>
  <label>Data</label><input type="date" id="f-data">
  <label>Nome do campeonato</label><input id="f-nome">
  <label>Formato</label><input id="f-formato" value="6x6">
  <label>Valor da inscrição (R$)</label><input id="f-valor" type="number" value="30">
  <label>Descrição (opcional)</label><input id="f-desc">
  <label>Quantos times</label><input id="f-vagas" type="number" value="16">
  <button class="primary" id="btn-criar">Criar campeonato</button>
  <div class="msg" id="msg-criar"></div>
</main>

<div class="modal" id="modal">
  <div class="box">
    <button class="x" onclick="fechar()">×</button>
    <h3 id="m-titulo" style="margin-top:0"></h3>
    <label>Plataforma</label>
    <select id="m-platform"><option value="common-gen5">PS5 / Xbox Series / PC</option><option value="common-gen4">PS4 / Xbox One</option></select>
    <label>Nome do clube no EA FC</label>
    <input id="m-clube" placeholder="ex.: Sokafofos">
    <button class="primary" id="m-buscar">Buscar clube</button>
    <button class="primary" id="m-ok" style="display:none">Inscrever e importar elenco</button>
    <div id="m-opcoes"></div>
    <div class="msg" id="m-msg"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = d => d ? d.split('-').reverse().join('/') : '';
const brl = v => Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let campAtual = null, camps = [], clubeSelecionado = null;

function adminToken() {
  let t = sessionStorage.getItem('adm');
  if (!t) { t = prompt('Senha de admin:'); if (t) sessionStorage.setItem('adm', t); }
  return t;
}

async function carregar() {
  camps = await (await fetch('/api/campeonatos')).json();
  $('#lista').innerHTML = camps.length ? camps.map(c => `
    <div class="card" data-id="${esc(c.id)}">
      <div class="tags"><span>${fmtData(c.data)}</span><span>${esc(c.formato)}</span></div>
      <h3>${esc(c.nome)}</h3>
      <p>${esc(c.descricao)}</p>
      <div class="price">${brl(c.valor)}<small>${c.times.length}/${c.vagas} times</small></div>
      <div class="actions">
        <span class="link">Inscrever time →</span>
        <button class="btn-excluir" data-id="${esc(c.id)}">🗑 Excluir</button>
      </div>
    </div>`).join('') : '<div class="sub">Nenhum campeonato ainda.</div>';
}

// clique no card = abrir inscrição | clique em excluir = apagar
$('#lista').addEventListener('click', async e => {
  const del = e.target.closest('.btn-excluir');
  if (del) {
    e.stopPropagation();
    if (!confirm('Excluir este campeonato? Isso não pode ser desfeito.')) return;
    const t = adminToken(); if (!t) return;
    const r = await fetch('/api/campeonatos/' + del.dataset.id, { method:'DELETE', headers:{'x-admin-token':t} });
    if (r.status === 401) { sessionStorage.removeItem('adm'); return alert('Senha de admin inválida.'); }
    return carregar();
  }
  const card = e.target.closest('.card');
  if (card) abrir(card.dataset.id);
});

function abrir(id) {
  campAtual = camps.find(c => c.id === id);
  $('#m-titulo').textContent = campAtual.nome;
  $('#m-clube').value = ''; $('#m-opcoes').innerHTML = ''; $('#m-msg').textContent = ''; $('#m-ok').style.display='none'; clubeSelecionado=null;
  $('#modal').classList.add('open');
}
function fechar() { $('#modal').classList.remove('open'); }

async function buscarClube() {
  const nome = $('#m-clube').value.trim();
  const platform = $('#m-platform').value;
  const msg = $('#m-msg');
  if (!nome) { msg.className='msg erro'; msg.textContent='Digite o nome do clube.'; return; }
  msg.className='msg'; msg.textContent='Buscando clube no FC 26...';
  $('#m-opcoes').innerHTML=''; $('#m-ok').style.display='none'; clubeSelecionado=null;
  try {
    const r = await fetch(`/api/ea/clube/${encodeURIComponent(nome)}?platform=${encodeURIComponent(platform)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || 'Erro ao consultar a EA.');
    if (!d.length) { msg.className='msg erro'; msg.textContent='Nenhum clube encontrado. Confira o nome e a plataforma.'; return; }
    msg.className='msg'; msg.textContent='Selecione o clube correto:';
    $('#m-opcoes').innerHTML = d.map(o => `<button class="opcao" data-id="${esc(o.clubId)}" data-nome="${esc(o.nome)}"><b>${esc(o.nome)}</b><br><small>ID ${esc(o.clubId)}${o.division ? ' · Divisão '+esc(o.division) : ''}${o.owner ? ' · Dono: '+esc(o.owner) : ''}</small></button>`).join('');
  } catch(e) { msg.className='msg erro'; msg.textContent=e.message; }
}

async function inscreverSelecionado() {
  if (!clubeSelecionado) return;
  const msg = $('#m-msg'); msg.className='msg'; msg.textContent='Importando elenco do FC 26...';
  $('#m-ok').disabled=true;
  try {
    const r = await fetch(`/api/campeonatos/${campAtual.id}/inscrever`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(clubeSelecionado) });
    const d = await r.json();
    if (r.ok) {
      msg.className='msg ok';
      msg.innerHTML=`✅ <b>${esc(d.nome)}</b> vinculado e inscrito com ${d.jogadores.length} jogadores:` + `<ul class="jog">${d.jogadores.map(j=>`<li>${esc(j.nome)} ${j.posicao?'— '+esc(j.posicao):''}</li>`).join('')}</ul>`;
      $('#m-ok').style.display='none'; $('#m-opcoes').innerHTML=''; clubeSelecionado=null; carregar();
    } else { throw new Error(d.erro || 'Erro ao inscrever.'); }
  } catch(e) { msg.className='msg erro'; msg.textContent=e.message; }
  finally { $('#m-ok').disabled=false; }
}

$('#m-buscar').onclick = buscarClube;
$('#m-clube').addEventListener('keydown', e => { if(e.key==='Enter') buscarClube(); });
$('#m-ok').onclick = inscreverSelecionado;
$('#m-opcoes').addEventListener('click', async e => {
  const b=e.target.closest('.opcao'); if(!b) return;
  clubeSelecionado={clubId:b.dataset.id, clubName:b.dataset.nome, platform:$('#m-platform').value};
  $('#m-msg').className='msg'; $('#m-msg').textContent='Carregando elenco para conferência...';
  try {
    const r=await fetch(`/api/ea/clube/${encodeURIComponent(b.dataset.id)}/elenco?platform=${encodeURIComponent($('#m-platform').value)}`);
    const d=await r.json();
    if(!r.ok) throw new Error(d.erro||'Não foi possível carregar o elenco.');
    clubeSelecionado.clubName=d.nome||b.dataset.nome;
    $('#m-msg').innerHTML=`<b>${esc(clubeSelecionado.clubName)}</b> — ${d.jogadores.length} jogadores encontrados. Confira a lista e confirme.`;
    $('#m-opcoes').innerHTML=`<ul class="jog">${d.jogadores.map(j=>`<li>${esc(j.nome)} ${j.posicao?'— '+esc(j.posicao):''}</li>`).join('')}</ul>`;
    $('#m-ok').style.display='inline-block';
  } catch(e) { clubeSelecionado=null; $('#m-msg').className='msg erro'; $('#m-msg').textContent=e.message; }
});

$('#btn-criar').onclick = async () => {
  const t = adminToken(); if (!t) return;
  const body = { data:$('#f-data').value, nome:$('#f-nome').value, formato:$('#f-formato').value,
    valor:$('#f-valor').value, descricao:$('#f-desc').value, vagas:$('#f-vagas').value };
  const r = await fetch('/api/campeonatos', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':t}, body:JSON.stringify(body) });
  const d = await r.json();
  const m = $('#msg-criar');
  if (r.ok) { m.className='msg ok'; m.textContent='Campeonato criado!'; $('#f-nome').value=''; $('#f-desc').value=''; carregar(); }
  else { m.className='msg erro'; m.textContent = d.erro; if (r.status===401) sessionStorage.removeItem('adm'); }
};

carregar();
</script>
</body>
</html>
